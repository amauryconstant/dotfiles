# Starship base config: every module, symbol and rule, shared by all themes.
#
# Starship reads exactly one file and has no include, so this is never read
# directly. theme-apply-starship concatenates it with the active theme's
# palette fragment (themes/current/starship.toml, a [palettes.theme] table)
# into ~/.config/starship.toml. That file is generated: edit this one, or a
# theme fragment, never it.

"$schema" = 'https://starship.rs/config-schema.json'

# Defined by the theme fragment appended after this file.
palette = "theme"


