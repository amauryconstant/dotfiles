# ============================================================================
# Quickshell Shell (bar + OSDs)
# ============================================================================
# Legacy .conf twin of quickshell.lua; both are kept until the .conf set is
# retired (_guides/HYPRLAND_LUA_CUTOVER.md). Waybar was retired 2026-10-15, so
# this is the only bar drop-in and the only claim on SUPER+B.
# Roadmap: _plans/archive/QUICKSHELL_SHELL.md
# ============================================================================

# NOT autostarted here. The shell owns org.freedesktop.Notifications on top of
# the bar, the OSD and the launcher, so an unsupervised exec-once leaves the
# desktop without all of them the moment it dies. It runs as
# systemd/user/quickshell.service instead:
#   systemctl --user restart quickshell.service   # the only reload path

# Goes through the script, not a raw `ipc call`: IPC only reaches a RUNNING
# instance, so a direct binding silently did nothing whenever the bar was down.
bindd = SUPER, B, Toggle status bar, exec, ~/.local/lib/scripts/desktop/quickshell-toggle

# Primary keys. The old Wofi SUPER+D and wlogout SUPER+SHIFT+Q binds were
# removed with their tools (2026-10-15); duplicate binds STACK in Hyprland.
bindd = SUPER, D, Application launcher, exec, ~/.local/lib/scripts/desktop/quickshell-toggle launcher
bindd = SUPER SHIFT, Q, Power menu, exec, ~/.local/lib/scripts/desktop/quickshell-toggle power

# Clipboard history, taken from `cliphist list | wofi --dmenu | cliphist decode
# | wl-copy`. SUPER+SHIFT+C has no successor: deletion is Shift+Delete inside
# the surface, where the entry being deleted is the one on screen.
# cliphist keeps the store and media/clipboard-store keeps filtering it; only
# the picker moved.
bindd = SUPER, C, Clipboard history, exec, ~/.local/lib/scripts/desktop/quickshell-toggle clipboard

# Popovers (design page Shell-06-Popovers). ONE submap rather than seven
# top-level keys -- see the .lua twin for the rationale. Opening a popover this
# way is KEYBOARD mode: focus grab, cursor on the first row, focus ring. A
# pointer click on the widget opens the same surface without any of the three.
bindd = SUPER, P, Popovers, submap, popovers
submap = popovers
bind = , A, exec, ~/.local/lib/scripts/desktop/quickshell-toggle popover audio
bind = , A, submap, reset
bind = , N, exec, ~/.local/lib/scripts/desktop/quickshell-toggle popover network
bind = , N, submap, reset
bind = , B, exec, ~/.local/lib/scripts/desktop/quickshell-toggle popover bluetooth
bind = , B, submap, reset
bind = , C, exec, ~/.local/lib/scripts/desktop/quickshell-toggle popover calendar
bind = , C, submap, reset
bind = , M, exec, ~/.local/lib/scripts/desktop/quickshell-toggle popover media
bind = , M, submap, reset
bind = , E, exec, ~/.local/lib/scripts/desktop/quickshell-toggle popover meters
bind = , E, submap, reset
bind = , W, exec, ~/.local/lib/scripts/desktop/quickshell-toggle popover power
bind = , W, submap, reset
bind = , T, exec, ~/.local/lib/scripts/desktop/quickshell-toggle popover nightlight
bind = , T, submap, reset
bind = , escape, submap, reset
submap = reset

# Toast open/close effect -- see the .lua twin for the rationale and the
# alternatives ("popin 80%", "fade", "noanim"). The direction is explicit:
# bare "slide" picks the nearest edge, which for a top-right anchor is the top.
layerrule = match:namespace = quickshell-notifications, animation slide right
