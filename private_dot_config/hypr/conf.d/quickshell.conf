# ============================================================================
# Quickshell Shell (bar + OSDs)
# ============================================================================
# Deployed only when features.quickshell_shell.enabled is true — the gate is
# in .chezmoiignore. Legacy .conf twin of quickshell.lua; both are kept until
# the .conf set is retired (_guides/HYPRLAND_LUA_CUTOVER.md).
#
# Mutually exclusive with conf.d/waybar.conf: this bar floats (40 tall, inset
# 8, reserving 56) and Waybar's 30px full-bleed bar cannot stack with it. That
# exclusivity is what lets both drop-ins claim SUPER+B.
# Roadmap: _plans/archive/QUICKSHELL_SHELL.md
# ============================================================================

exec-once = quickshell -c dotfiles

# Goes through the script, not a raw `ipc call`: IPC only reaches a RUNNING
# instance, so a direct binding silently did nothing whenever the bar was down.
bindd = SUPER, B, Toggle status bar, exec, ~/.local/lib/scripts/desktop/quickshell-toggle

# Phase 5 now owns the PRIMARY keys. The Wofi SUPER+D in
# conf/bindings/applications.conf.tmpl and the wlogout SUPER+SHIFT+Q in
# conf/bindings/system-control.conf.tmpl are gated off on the same
# features.quickshell_shell flag — duplicate binds STACK in Hyprland, so the
# old ones must be gated off rather than shadowed.
# Wofi is not removable regardless — it serves cliphist and every --dmenu caller.
bindd = SUPER, D, Application launcher, exec, ~/.local/lib/scripts/desktop/quickshell-toggle launcher
bindd = SUPER SHIFT, Q, Power menu, exec, ~/.local/lib/scripts/desktop/quickshell-toggle power

# Clipboard history, taken from `cliphist list | wofi --dmenu | cliphist decode
# | wl-copy`. SUPER+SHIFT+C has no successor: deletion is Shift+Delete inside
# the surface, where the entry being deleted is the one on screen.
# cliphist keeps the store and media/clipboard-store keeps filtering it; only
# the picker moved.
bindd = SUPER, C, Clipboard history, exec, ~/.local/lib/scripts/desktop/quickshell-toggle clipboard

# Toast open/close effect -- see the .lua twin for the rationale and the
# alternatives ("popin 80%", "fade", "noanim"). The direction is explicit:
# bare "slide" picks the nearest edge, which for a top-right anchor is the top.
layerrule = match:namespace = quickshell-notifications, animation slide right
