# ============================================================================
# Quickshell Shell (bar + OSDs)
# ============================================================================
# Deployed only when features.quickshell_shell.enabled is true — the gate is
# in .chezmoiignore. Legacy .conf twin of quickshell.lua; both are kept until
# the .conf set is retired (_guides/HYPRLAND_LUA_CUTOVER.md).
#
# Coexists with Waybar during A/B: both anchor top and stack via layer-shell
# exclusive zones. Roadmap: _plans/QUICKSHELL_SHELL.md
# ============================================================================

exec-once = quickshell -c dotfiles

# SUPER+B stays on waybar-toggle while both bars run, so either can be hidden
# independently for an A/B look. Goes through the script, not a raw `ipc call`:
# IPC only reaches a RUNNING instance, so a direct binding silently did nothing
# whenever the bar was down.
bindd = SUPER SHIFT, B, Toggle Quickshell bar, exec, ~/.local/lib/scripts/desktop/quickshell-toggle
