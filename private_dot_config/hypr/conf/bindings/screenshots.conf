# ============================================================================
# Screenshots
# ============================================================================
# Screenshot tools with Satty annotation editor integration.
# ============================================================================

# Smart screenshot with Satty editor: Print Screen
# Auto-snaps to window if selection is tiny, opens annotation editor
bindd = , Print, Smart screenshot, exec, ~/.local/lib/scripts/media/screenshot smart

# Quick screenshot to clipboard: Shift + Print Screen
# Bypasses editor, direct to clipboard for speed
bindd = SHIFT, Print, Quick screenshot to clipboard, exec, ~/.local/lib/scripts/media/screenshot smart clipboard

# Color picker: Super + Print Screen
# Pick color and copy hex code to clipboard
bindd = SUPER, Print, Color picker, exec, pkill hyprpicker || hyprpicker -a

# Fullscreen screenshot with editor: Super + Shift + Print Screen
bindd = SUPER SHIFT, Print, Fullscreen screenshot, exec, ~/.local/lib/scripts/media/screenshot fullscreen

# Screen recording with audio: Alt + Shift + Print Screen (toggle)
bindd = ALT SHIFT, Print, Screen recording with audio, exec, ~/.local/lib/scripts/desktop/screenrecord --with-audio

# Fullscreen recording with audio: Ctrl + Alt + Shift + Print Screen (toggle)
bindd = CTRL ALT SHIFT, Print, Fullscreen recording with audio, exec, ~/.local/lib/scripts/desktop/screenrecord --with-audio

# Region/window screenshot without smart-snap: Super + Ctrl / Super + Alt + Print Screen
bindd = SUPER CTRL, Print, Region screenshot, exec, ~/.local/lib/scripts/media/screenshot region
bindd = SUPER ALT, Print, Window screenshot, exec, ~/.local/lib/scripts/media/screenshot windows

# QR code / OCR capture from a screen region: Ctrl / Super + Ctrl + Shift + Print Screen
bindd = CTRL, Print, Capture QR code, exec, ~/.local/lib/scripts/media/capture-qr
bindd = SUPER CTRL SHIFT, Print, Capture text (OCR), exec, ~/.local/lib/scripts/media/capture-text-extraction
