# ============================================================================
# System Control
# ============================================================================
# System-level operations: lock, power, help, menus.
# ============================================================================

# Lock screen: Super + L
bindd = SUPER, L, Lock screen, exec, ~/.local/lib/scripts/desktop/immediate-lock

# Actions: Super + Space
# The launcher's `>` mode: capture and maintenance actions
bindd = SUPER, Space, Actions, exec, ~/.local/lib/scripts/desktop/quickshell-toggle launcher actions

# Notification center: Super + Shift + N
bindd = SUPER SHIFT, N, Notification center, exec, ~/.local/lib/scripts/desktop/quickshell-toggle notifications

# Keybinding cheatsheet: Super + /
# The shell draws a document, which is what surface 9 asks for; with the shell
# down quickshell-toggle falls back to the script's own picker.
bindd = SUPER, slash, Keybinding help, exec, ~/.local/lib/scripts/desktop/quickshell-toggle keybindings
