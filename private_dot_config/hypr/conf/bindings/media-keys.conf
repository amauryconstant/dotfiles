# ============================================================================
# Media Keys
# ============================================================================
# Hardware media keys for volume, brightness, and playback control.
#
# Flags: l = works while locked (hyprlock), e = repeats on key hold.
# Volume/brightness use both; playback is locked-only (repeat is meaningless).
# Mirrors media-keys.lua — keep the two in sync.
# ============================================================================

# Volume control using pamixer
bindeld = , XF86AudioRaiseVolume, Volume up, exec, pamixer -i 5
bindeld = , XF86AudioLowerVolume, Volume down, exec, pamixer -d 5
bindeld = , XF86AudioMute, Toggle mute, exec, pamixer -t

# Brightness control — internal backlight (laptop) or external monitor via DDC/CI (desktop)
bindeld = , XF86MonBrightnessUp, Brightness up, exec, ~/.local/lib/scripts/desktop/brightness-set up
bindeld = , XF86MonBrightnessDown, Brightness down, exec, ~/.local/lib/scripts/desktop/brightness-set down

# Media playback control using playerctl
# Controls any MPRIS-compatible media player (Spotify, Firefox, mpv, etc.)
bindld = , XF86AudioPlay, Play/pause, exec, playerctl play-pause
bindld = , XF86AudioPause, Pause, exec, playerctl pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous
