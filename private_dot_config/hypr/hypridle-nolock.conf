# ============================================================================
# hypridle Configuration — No-Lock Mode
# ============================================================================
# Same idle daemon as hypridle.conf.tmpl, minus the lock-screen listener.
# Used by idle-toggle-nolock to keep power-saving (display off) active while
# suppressing hyprlock — e.g. watching a video without the screen locking.
#
# Keep the timeout below in sync with listener 2 in hypridle.conf.tmpl.
# ============================================================================

general {
    after_sleep_cmd = hyprctl dispatch dpms on  # Turn on display after resume
}

# Turn off displays after 10 minutes of inactivity (no lock)
listener {
    timeout = 600                                # 10 minutes
    on-timeout = hyprctl dispatch dpms off       # Turn off displays
    on-resume = hyprctl dispatch dpms on         # Turn on displays on activity
}
