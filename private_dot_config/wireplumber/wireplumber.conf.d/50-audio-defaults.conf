## Audio defaults — managed by chezmoi, every machine
##
## Verified against the shipped templates in
## /usr/share/doc/wireplumber/examples/wireplumber.conf.d/{bluetooth,device}.conf
## on wireplumber 0.5.17. The laptop's Bluetooth policy is in
## 51-bluetooth-laptop.conf (laptop only); WirePlumber merges the two
## wireplumber.settings objects.

wireplumber.settings = {
  ## Upstream lands a new sink at 0.064. A device that plays at 6% the first
  ## time reads as broken hardware.
  device.routes.default-sink-volume = 0.5
}
