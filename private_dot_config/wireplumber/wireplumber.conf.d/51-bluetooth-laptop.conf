## Bluetooth headset policy — managed by chezmoi, LAPTOP ONLY
##
## Gated in .chezmoiignore on chassisType: the desktop dictates and takes calls
## on a wired/USB mic, so it keeps upstream's headset-profile autoswitch. See
## ../CLAUDE.md for the incident behind this file.

wireplumber.settings = {
  ## A2DP carries no microphone. Upstream's default is to show one anyway and
  ## switch the card to HFP whenever something opens it — which means every
  ## dictation drags the headset out of LDAC. On this laptop's AX200 that SCO
  ## transport fails and takes the A2DP SINK down with it, so capture returns
  ## digital silence and playback dies until the device is reconnected.
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.rules = [
  ## Connect the playback profiles on their own. With the autoswitch above off,
  ## the headset profiles are never reached for at all.
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink a2dp_source ]
      }
    }
  }
]
