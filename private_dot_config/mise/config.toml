[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]

[settings.python]
uv_venv_auto = true

[settings.npm]
bun = true

[tools]
# Runner & Package manager
uv = "latest"
bun = "latest"
node = [{ version = "24" }, { version = "latest" }]

# Development Tools
prettier = "latest"
"npm:playwright" = { version = "latest", postinstall = "playwright install" }

# AI Tools
"herdr" = "latest"
"claude-code" = "latest"
"opencode" = "latest"
"npm:@fission-ai/openspec" = "latest"
"llmfit" = "latest"
"github:arimxyer/models" = "latest"
"pipx:claude-monitor" = "latest"
"npm:ccusage" = "latest"
"npm:@caveman-ai/cli" = { version = "latest", postinstall = "caveman setup --install; command -v opencode >/dev/null 2>&1 && caveman enable opencode || true" }

# CLIs
"github:1jehuang/mermaid-rs-renderer" = "latest"
"pipx:posting" = "latest"
awscli = "latest"
"github:abhixdd/ghgrab" = "latest"

# Custom tools
"gitlab:amoconst/twiggit" = "latest"
