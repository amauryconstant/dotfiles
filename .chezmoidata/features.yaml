# Optional feature toggles
# Set enabled: false to skip setup without removing the package from packages.yaml

features:
  kanata:
    enabled: true
  voxtype:
    enabled: true
    gpu_device: 0
  restic:
    enabled: true
  quickshell_shell:
    enabled: true
  # Notifications. Separate from quickshell_shell on purpose: running the bar
  # must not imply taking org.freedesktop.Notifications away from swaync, which
  # is what this flag does (see
  # .chezmoiscripts/run_onchange_after_configure_notifications.sh.tmpl).
  # Flipping it back unmasks swaync and restores its SUPER+SHIFT+N binding.
  quickshell_notifications:
    enabled: true
  # Polkit authentication agent. Separate from quickshell_shell for the same
  # reason as notifications: a session may have exactly one agent, so running
  # the bar must not imply displacing the existing one. Flipping it back
  # deploys hypr/conf.d/polkit-gnome again, which restores the polkit-gnome
  # agent that hypr/conf/autostart used to start unconditionally.
  quickshell_polkit:
    enabled: true
  # In-shell lock screen (surface §22). Separate from quickshell_shell for the
  # same reason as notifications and polkit, but with a gentler failure mode:
  # desktop/immediate-lock routes at RUNTIME, so with this off — or with the
  # shell down, or its restart budget spent — SUPER+L still locks via hyprlock.
  quickshell_lock:
    enabled: true
