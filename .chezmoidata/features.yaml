# Optional feature toggles
# Set enabled: false to skip setup without removing the package from packages.yaml

features:
  kanata:
    enabled: true
  voxtype:
    enabled: true
    gpu_device: 0
  restic:
    enabled: true
  # In-shell lock screen (surface §22). Unlike the bar, notifications and polkit
  # it is optional, with a gentle failure mode: desktop/immediate-lock routes at RUNTIME, so with this off — or with the
  # shell down, or its restart budget spent — SUPER+L still locks via hyprlock.
  #
  # `chassis` lists the chassis types that own the lock (Config.qml.tmpl
  # combines it with `enabled`); drop one to send that machine back to hyprlock.
  # The desktop was left out 2026-10-14 to 2026-10-19: on the two-monitor NVIDIA
  # machine the lock froze a few seconds after appearing. Cause: the packaged
  # egl-wayland2 waits for a frame event with no timeout, the render thread
  # wedged in it and the main thread behind it. Fixed by running the shell on
  # the patched build (quickshell.service -> desktop/egl-wayland2-patched).
  # If that build is missing the freeze can return, and nothing here notices.
  # See _research/FIREFOX_NVIDIA_EGL_DEADLOCK.md.
  quickshell_lock:
    enabled: true
    chassis: [laptop, desktop]
