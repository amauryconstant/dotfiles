# Service configuration for systemd enablement
# Used by: run_once_after_002, run_once_after_004, run_once_after_006

services:
  system_services:
    # Core system services to enable at boot
    # requires_command: skip if this binary is not installed
    - name: docker.socket
      enabled: true
      user_groups: [docker]
    - name: bluetooth.service
      enabled: true
    - name: tailscaled.service
      enabled: true
      requires_command: tailscale
    - name: cups.service
      enabled: true
      requires_command: lpstat

  user_services:
    # User-level systemd services to enable
    - name: darkman.service
      enabled: true
    - name: hypridle.service # idle/lock daemon; no-lock mode swaps its config at runtime
      enabled: true
      start: true
      requires_command: hypridle
    # Monitor automation. Were enabled by run_once_before_008, which ran BEFORE
    # packages and files existed on a fresh machine and aborted the apply.
    - name: hyprdynamicmonitors-prepare.service # pre-session profile render (graphical-session-pre.target)
      enabled: true
      start: false
      requires_command: hyprdynamicmonitors
    - name: hyprdynamicmonitors.service
      enabled: true
      start: true
      requires_command: hyprdynamicmonitors
    - name: hyprwhenthen.service # event-driven window rules (OAuth popups etc.)
      enabled: true
      start: true
      requires_command: hyprwhenthen
    - name: quickshell.service # desktop shell; its ConditionPathExists keeps it inert on the Waybar branch
      enabled: true
      start: true
      requires_command: quickshell
    - name: llama-swap.service
      enabled: true
      start: false
      requires_command: llama-swap
    - name: llama-server.service # Phase-0 fallback (single static model); superseded by llama-swap
      enabled: false
      start: false
      requires_command: llama-server

  user_timers:
    # User-level systemd timers to enable
    # start: true = enable AND start immediately; false = enable only
    - name: wallpaper-cycle
      enabled: true
      start: true
    - name: system-health-check
      enabled: true
      start: true
    - name: home-backup
      enabled: true
      start: false # enable only — needs restic repo init first
    - name: session-autosave
      enabled: true
      start: true
