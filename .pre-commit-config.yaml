repos:
- repo: local
  hooks:
  - id: chezmoi-destroy
    name: Chezmoi destroy staged deletions
    entry: mise run destroy:staged
    language: system
    pass_filenames: false
    always_run: true
  - id: shellcheck-staged
    name: Shellcheck staged scripts
    entry: mise run lint:staged
    language: system
    pass_filenames: false
    always_run: true
  - id: chezmoi-sources
    name: Validate staged chezmoi sources (generators, renders, secrets)
    entry: mise run lint:chezmoi-sources
    language: system
    pass_filenames: false
    always_run: true
  - id: lua-staged
    name: stylua --check staged Lua files
    entry: mise run lint:lua-staged
    language: system
    pass_filenames: false
    always_run: true
  - id: json-staged
    name: jq empty on staged JSON/JSONC files
    entry: mise run lint:json-staged
    language: system
    pass_filenames: false
    always_run: true
  - id: yaml-staged
    name: yamllint on staged YAML data files
    entry: mise run lint:yaml-staged
    language: system
    pass_filenames: false
    always_run: true
